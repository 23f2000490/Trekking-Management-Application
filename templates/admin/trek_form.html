{% extends "base.html" %}
{% block title %}{% if trek %}Edit Trek{% else %}Add New Trek{% endif %}{% endblock %}

{% block content %}
<h2 class="mb-4">{% if trek %}Edit Trek{% else %}Add New Trek{% endif %}</h2>

<form method="POST">
    <div class="row">
        <div class="col-md-6 mb-3">
            <label class="form-label">Trek Name</label>
            <input type="text" name="name" class="form-control" value="{{ trek.name if trek else '' }}" required>
        </div>
        <div class="col-md-6 mb-3">
            <label class="form-label">Location</label>
            <input type="text" name="location" class="form-control" value="{{ trek.location if trek else '' }}" required>
        </div>
    </div>

    <div class="row">
        <div class="col-md-4 mb-3">
            <label class="form-label">Difficulty</label>
            <select name="difficulty" class="form-select" required>
                <option value="" disabled {% if not trek %}selected{% endif %}>-- Select --</option>
                {% for level in ["Easy", "Moderate", "Hard"] %}
                <option value="{{ level }}" {% if trek and trek.difficulty == level %}selected{% endif %}>{{ level }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="col-md-4 mb-3">
            <label class="form-label">Duration (Days)</label>
            <input type="number" name="duration" class="form-control" min="1" value="{{ trek.duration if trek else '' }}" required>
        </div>
        <div class="col-md-4 mb-3">
            <label class="form-label">Total Slots</label>
            <input type="number" name="total_slots" class="form-control" min="1" value="{{ trek.total_slots if trek else '' }}" required>
        </div>
    </div>

    <div class="row">
        <div class="col-md-6 mb-3">
            <label class="form-label">Start Date</label>
            <input type="date" name="start_date" class="form-control" value="{{ trek.start_date if trek else '' }}" required>
        </div>
        <div class="col-md-6 mb-3">
            <label class="form-label">End Date</label>
            <input type="date" name="end_date" class="form-control" value="{{ trek.end_date if trek else '' }}" required>
        </div>
    </div>

    <div class="row">
        <div class="col-md-6 mb-3">
            <label class="form-label">Assign Staff</label>
            <select name="assigned_staff_id" class="form-select">
                <option value="">-- Unassigned --</option>
                {% for staff in staff_list %}
                <option value="{{ staff.id }}" {% if trek and trek.assigned_staff_id == staff.id %}selected{% endif %}>
                    {{ staff.user.name }}
                </option>
                {% endfor %}
            </select>
        </div>
        <div class="col-md-6 mb-3">
            <label class="form-label">Status</label>
            <select name="status" class="form-select" required>
                {% for s in ["Pending", "Approved", "Open", "Closed", "Completed"] %}
                <option value="{{ s }}" {% if trek and trek.status == s %}selected{% elif not trek and s == "Pending" %}selected{% endif %}>{{ s }}</option>
                {% endfor %}
            </select>
        </div>
    </div>

    <div class="mb-3">
        <label class="form-label">Description</label>
        <textarea name="description" class="form-control" rows="3">{{ trek.description if trek else '' }}</textarea>
    </div>

    <button type="submit" class="btn btn-primary">{% if trek %}Update Trek{% else %}Save Trek{% endif %}</button>
    <a href="{{ url_for('admin.manage_treks') }}" class="btn btn-outline-secondary">Cancel</a>
</form>
{% endblock %}
